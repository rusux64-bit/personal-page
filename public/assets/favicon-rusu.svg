<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    /* Dark (matches the site's hero card) */
    :root {
      --container: #74351A;
      --letter: #FFDBCB;
      --accent: #F4A57E;
    }
    /* Light theme */
    @media (prefers-color-scheme: light) {
      :root {
        --container: #FFDBCB;
        --letter: #5A2711;
        --accent: #B4552B;
      }
    }
  </style>
  <rect width="64" height="64" rx="20" fill="var(--container)"/>
  <g transform="translate(-1 0)" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 33L44 48" stroke="var(--accent)"/>
    <path d="M22 48V16H35A8.5 8.5 0 0 1 35 33H22" stroke="var(--letter)"/>
  </g>
</svg>
